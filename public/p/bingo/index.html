<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Bingo</title>
<style>
  /* Archivo único y sin recursos externos: funciona sin internet durante el evento.
     Los colores salen de estas variables; el lápiz las reemplaza con el color que se elija. */
  :root {
    --fondo: #fdf1f5;
    --brillo: #fbd9e6;
    --panel: #fffafc;
    --linea: #f3c6d6;
    --texto: #5c2340;
    --texto-suave: #94506f;
    --acento: #c2255c;
    --salido: #d02f68;
    --ultimo: #9c1c48;
    --balota-luz: #f9a8c6;
    --balota: #e64980;
    --sobre-salido: #fffafc;
    --sobre-ultimo: #fffafc;
    --sobre-balota: #fffafc;
    --sombra: rgba(156, 28, 72, 0.16);
    --velo: rgba(40, 14, 28, 0.5);
    --resorte: cubic-bezier(0.34, 1.56, 0.64, 1);
    --suave: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #1f0f17;
      --brillo: #3a1527;
      --panel: #2c1520;
      --linea: #57283f;
      --texto: #fbe7f0;
      --texto-suave: #e0a9c2;
      --acento: #f783ac;
      --salido: #a8255a;
      --ultimo: #e64980;
      --sombra: rgba(0, 0, 0, 0.35);
      --velo: rgba(20, 6, 13, 0.7);
    }
    .logo, .logo-vista img { background: #fffafc; border-radius: 16px; padding: 8px; }
  }

  /* Progreso del aro: se registra para que el cambio se anime */
  @property --p { syntax: '<number>'; inherits: true; initial-value: 0; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(70vmax 70vmax at -10% -20%, var(--brillo), transparent 60%),
      radial-gradient(60vmax 60vmax at 110% 120%, var(--brillo), transparent 60%),
      var(--fondo);
    background-attachment: fixed;
    color: var(--texto);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-direction: column;
    padding: clamp(10px, 2vmin, 28px);
    gap: clamp(10px, 1.6vmin, 22px);
    user-select: none;
  }
  button, input, textarea { font-family: inherit; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, .subir:focus-within, .chico:focus-within { outline: 3px solid var(--acento); outline-offset: 3px; }
  .oculto { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  /* ---------- Encabezado ---------- */
  header {
    display: flex;
    align-items: center;
    gap: clamp(14px, 2.2vmin, 30px);
    flex-wrap: wrap;
  }
  header > * { animation: aparecer 0.7s var(--suave) both; }
  header > :nth-child(2) { animation-delay: 0.08s; }
  header > :nth-child(3) { animation-delay: 0.16s; }
  header > :nth-child(4) { animation-delay: 0.24s; }

  .anillo {
    --p: 0;
    flex-shrink: 0;
    padding: clamp(6px, 0.9vmin, 10px);
    border-radius: 50%;
    background: conic-gradient(var(--salido) calc(var(--p) * 360deg), var(--linea) 0);
    transition: --p 0.8s var(--suave);
  }
  .balota {
    width: clamp(110px, 17vmin, 200px);
    height: clamp(110px, 17vmin, 200px);
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, var(--balota-luz) 0%, var(--balota) 38%, var(--ultimo) 78%);
    color: var(--sobre-balota);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 clamp(4px, 0.6vmin, 7px) var(--panel), 0 14px 30px var(--sombra);
    position: relative;
    overflow: hidden;
  }
  /* brillo de la balota */
  .balota::before {
    content: "";
    position: absolute;
    width: 38%;
    height: 22%;
    top: 12%;
    left: 20%;
    border-radius: 50%;
    background: rgba(255, 250, 252, 0.45);
    filter: blur(6px);
    transform: rotate(-24deg);
  }
  .balota.vacia { background: var(--panel); color: var(--texto-suave); }
  .balota.vacia::before { display: none; }
  .balota.entra { animation: rodar 0.8s var(--resorte); }
  .balota.vuelve { animation: volver 0.45s var(--suave); }
  .balota .letra { font-size: clamp(18px, 3.2vmin, 38px); font-weight: 700; line-height: 1; letter-spacing: 0.04em; }
  .balota.vacia .letra { font-size: clamp(13px, 2vmin, 22px); text-transform: uppercase; letter-spacing: 0.12em; }
  .balota .numero { font-size: clamp(44px, 7.8vmin, 96px); font-weight: 800; line-height: 1.05; }

  .info { display: flex; flex-direction: column; gap: 6px; min-width: 190px; }
  .titulo {
    font-size: clamp(24px, 3.4vmin, 42px);
    font-weight: 800;
    color: var(--acento);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .corazon { display: inline-block; color: var(--salido); animation: latir 2.4s ease-in-out infinite; }
  .lema { color: var(--texto-suave); font-size: clamp(14px, 1.7vmin, 18px); font-style: italic; }
  .sub { color: var(--texto-suave); font-size: clamp(14px, 1.8vmin, 19px); }
  .sub strong { color: var(--texto); font-weight: 700; }
  .historial { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-height: clamp(34px, 4.8vmin, 54px); margin-top: 2px; }
  .mini {
    width: clamp(36px, 4.8vmin, 54px);
    height: clamp(36px, 4.8vmin, 54px);
    border-radius: 50%;
    background: var(--salido);
    color: var(--sobre-salido);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: clamp(13px, 1.8vmin, 20px);
    box-shadow: 0 4px 10px var(--sombra);
  }
  .mini:nth-child(n + 4) { opacity: 0.7; }
  .mini.nuevo { animation: deslizar 0.55s var(--resorte); }
  .vacio { color: var(--texto-suave); font-size: clamp(13px, 1.6vmin, 16px); }

  /* ---------- Premio ---------- */
  .premio {
    position: relative;
    flex: 1 1 240px;
    max-width: 380px;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: clamp(14px, 1.8vmin, 20px) clamp(14px, 1.8vmin, 20px) clamp(12px, 1.4vmin, 16px);
    background: var(--panel);
    border: 2px solid var(--linea);
    border-radius: 20px;
    box-shadow: 0 10px 24px var(--sombra);
    overflow: hidden;
  }
  .premio::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 6px;
    background: linear-gradient(90deg, var(--salido), var(--ultimo));
  }
  .premio-label {
    font-size: clamp(12px, 1.4vmin, 15px);
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--acento);
  }
  .premio-cuerpo { flex: 1; display: flex; gap: 14px; align-items: center; min-height: 0; }
  .premio-foto {
    position: relative;
    flex-shrink: 0;
    width: clamp(72px, 11vmin, 130px);
    aspect-ratio: 1;
    border-radius: 14px;
    overflow: hidden;
    background: var(--fondo);
  }
  .premio-foto.entra { animation: pop 0.5s var(--resorte); }
  .premio-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .quitar {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 0;
    background: rgba(29, 26, 28, 0.6);
    color: #fffafc;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .premio-foto:hover .quitar, .premio-foto:focus-within .quitar { opacity: 1; }
  @media (hover: none) { .quitar { opacity: 1; } }
  .premio-texto { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .premio textarea {
    width: 100%;
    resize: none;
    border: 0;
    border-bottom: 2px dashed transparent;
    background: transparent;
    color: var(--texto);
    font-size: clamp(18px, 2.6vmin, 30px);
    font-weight: 800;
    line-height: 1.15;
    padding: 2px 0;
    field-sizing: content;
    max-height: 5.2em;
    user-select: text;
  }
  .premio textarea:hover, .premio textarea:focus { outline: none; border-bottom-color: var(--linea); }
  .premio textarea::placeholder { color: var(--texto-suave); font-weight: 600; opacity: 1; }
  .subir {
    position: relative;
    align-self: flex-start;
    margin-left: -10px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: clamp(13px, 1.5vmin, 15px);
    font-weight: 700;
    color: var(--acento);
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .subir:hover { background: var(--fondo); }
  .premio.con-foto .subir { display: none; }
  .aviso { font-size: 13px; color: var(--acento); min-height: 0; }
  .aviso:empty { display: none; }

  /* ---------- Acciones ---------- */
  .acciones { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 1.8vmin, 22px); }
  .botonera { display: flex; flex-direction: column; gap: 10px; }
  .logo { height: clamp(80px, 13vmin, 150px); width: auto; max-width: 220px; object-fit: contain; display: block; }
  button.accion {
    background: var(--panel);
    border: 2px solid var(--linea);
    color: var(--acento);
    font-size: clamp(14px, 1.7vmin, 17px);
    font-weight: 700;
    padding: 11px 20px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.25s, color 0.25s, border-color 0.25s, transform 0.25s var(--suave), opacity 0.25s;
  }
  button.accion:hover:not(:disabled) { background: var(--acento); border-color: var(--acento); color: var(--panel); transform: translateY(-2px); }
  button.accion:active:not(:disabled) { transform: scale(0.97); }
  button.accion:disabled { opacity: 0.45; cursor: not-allowed; }
  /* ---------- Tablero ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: clamp(5px, 0.8vmin, 10px);
    min-height: 0;
  }
  .fila {
    flex: 1;
    display: grid;
    grid-template-columns: clamp(38px, 5vmin, 64px) repeat(15, 1fr);
    gap: clamp(4px, 0.7vmin, 9px);
    min-height: 0;
    animation: aparecer 0.6s var(--suave) both;
    animation-delay: calc(var(--fila) * 70ms + 0.2s);
  }
  .de-nuevo .fila { animation-name: aparecer-otra; animation-delay: calc(var(--fila) * 50ms); }
  .letraFila {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 3.4vmin, 42px);
    font-weight: 800;
    color: var(--acento);
  }
  button.celda {
    position: relative;
    border: 2px solid var(--linea);
    border-radius: clamp(8px, 1.1vmin, 14px);
    background: var(--panel);
    color: var(--texto);
    font-size: clamp(18px, 3vmin, 40px);
    font-weight: 700;
    cursor: pointer;
    min-height: 44px;
    transition: background-color 0.35s, color 0.35s, border-color 0.35s, box-shadow 0.35s, transform 0.2s var(--suave);
  }
  button.celda:hover { transform: translateY(-2px); border-color: var(--salido); box-shadow: 0 6px 14px var(--sombra); }
  button.celda:active { transform: scale(0.94); }
  button.celda.salido { background: var(--salido); border-color: var(--salido); color: var(--sobre-salido); }
  button.celda.ultimo {
    z-index: 1;
    background: var(--ultimo);
    border-color: var(--ultimo);
    color: var(--sobre-ultimo);
    box-shadow: 0 0 0 3px var(--panel), 0 0 0 6px var(--ultimo), 0 10px 24px var(--sombra);
  }
  /* onda que sale de la última balota */
  button.celda.ultimo::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: inherit;
    border: 3px solid var(--ultimo);
    pointer-events: none;
    animation: onda 1.8s ease-out infinite;
  }
  button.celda.pop { animation: pop 0.5s var(--resorte); }

  /* ---------- Confirmación de juego nuevo ---------- */
  .velo {
    position: fixed;
    inset: 0;
    background: var(--velo);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0s 0.25s;
  }
  .velo.abierto { opacity: 1; visibility: visible; transition: opacity 0.25s; }
  .caja {
    background: var(--panel);
    border-radius: 20px;
    padding: 30px 26px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px var(--sombra);
    transform: translateY(14px) scale(0.96);
    transition: transform 0.4s var(--suave);
  }
  .velo.abierto .caja { transform: none; }
  .caja h2 { color: var(--acento); font-size: 26px; margin-bottom: 10px; }
  .caja p { color: var(--texto-suave); font-size: 18px; margin-bottom: 16px; }
  .check { display: inline-flex; align-items: center; gap: 10px; font-size: 17px; color: var(--texto); margin-bottom: 22px; cursor: pointer; }
  .check input { width: 22px; height: 22px; accent-color: var(--ultimo); }
  .caja .botones { display: flex; gap: 12px; }
  .caja button {
    flex: 1;
    min-height: 58px;
    font-size: 20px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.2s var(--suave);
  }
  .caja button:hover { transform: translateY(-2px); }
  .caja button:active { transform: scale(0.97); }
  .caja .cancelar { background: var(--panel); border: 2px solid var(--linea); color: var(--texto); }
  .caja .confirmar { background: var(--ultimo); border: 2px solid var(--ultimo); color: var(--sobre-ultimo); }

  /* ---------- Panel de personalización ---------- */
  dialog.panel {
    margin: 0 0 0 auto;
    width: min(400px, 100vw);
    height: 100dvh;
    max-height: 100dvh;
    max-width: 100vw;
    border: 0;
    padding: 28px 24px 24px;
    background: var(--panel);
    color: var(--texto);
    box-shadow: -20px 0 50px var(--sombra);
    overflow-y: auto;
    user-select: text;
  }
  dialog.panel[open] { animation: entrarPanel 0.45s var(--suave); }
  dialog.panel::backdrop { background: var(--velo); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .panel h2 { font-size: 26px; color: var(--acento); margin-bottom: 4px; }
  .panel .nota { color: var(--texto-suave); font-size: 15px; margin-bottom: 24px; }
  .campo { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; border: 0; }
  .campo > label, .campo > legend { font-size: 15px; font-weight: 700; color: var(--texto); margin-bottom: 0; }
  .campo legend { margin-bottom: 8px; }
  .panel input[type="text"] {
    font-size: 16px;
    padding: 11px 14px;
    border: 2px solid var(--linea);
    border-radius: 12px;
    background: var(--fondo);
    color: var(--texto);
    transition: border-color 0.2s;
  }
  .panel input[type="text"]:focus { outline: none; border-color: var(--acento); }
  .muestras { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .muestra {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid var(--panel);
    box-shadow: 0 0 0 2px var(--linea);
    background: var(--c);
    cursor: pointer;
    transition: transform 0.25s var(--resorte), box-shadow 0.2s;
  }
  .muestra:hover { transform: scale(1.1); }
  .muestra[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--texto); }
  .otro {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    color: var(--acento);
    cursor: pointer;
  }
  .otro input[type="color"] { width: 42px; height: 42px; border: 0; padding: 0; background: none; cursor: pointer; }
  .logo-vista { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo-vista img { height: 64px; width: auto; max-width: 140px; object-fit: contain; }
  .logo-vista .sin { color: var(--texto-suave); font-size: 15px; }
  .fila-botones { display: flex; flex-wrap: wrap; gap: 8px; }
  .chico {
    position: relative;
    display: inline-flex;
    align-items: center;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 999px;
    border: 2px solid var(--linea);
    background: var(--panel);
    color: var(--acento);
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s;
  }
  .chico:hover { border-color: var(--acento); background: var(--fondo); }
  .chico:disabled { opacity: 0.45; cursor: not-allowed; }
  .panel-pie {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    padding-top: 20px;
    border-top: 1px solid var(--linea);
  }
  .panel-pie .listo { background: var(--ultimo); border-color: var(--ultimo); color: var(--sobre-ultimo); padding: 11px 26px; }
  .panel-pie .listo:hover:not(:disabled) { background: var(--acento); border-color: var(--acento); }

  /* ---------- Animaciones ---------- */
  @keyframes aparecer { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes aparecer-otra { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes rodar {
    from { transform: translateY(-45%) rotate(-200deg) scale(0.5); opacity: 0; }
    60% { opacity: 1; }
    to { transform: none; }
  }
  @keyframes volver { from { transform: scale(0.82); opacity: 0.4; } to { transform: none; opacity: 1; } }
  @keyframes pop { 0% { transform: scale(0.7); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
  @keyframes onda { from { transform: scale(1); opacity: 0.75; } to { transform: scale(1.4); opacity: 0; } }
  @keyframes deslizar { from { transform: translateX(-18px) scale(0.5); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes latir { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.2); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  @keyframes entrarPanel { from { transform: translateX(48px); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 700px) {
    header { justify-content: center; text-align: center; }
    .info { align-items: center; }
    .historial { justify-content: center; }
    .premio { flex-basis: 100%; max-width: none; text-align: left; }
    .acciones { margin-left: 0; flex-wrap: wrap; justify-content: center; }
    .botonera { flex-direction: row; }
    .fila { grid-template-columns: 26px repeat(15, 1fr); gap: 3px; }
    button.celda { font-size: clamp(12px, 3.4vw, 18px); border-width: 1px; border-radius: 6px; min-height: 34px; }
    .letraFila { font-size: 18px; }
    /* aro más fino: con celdas tan juntas no debe tapar las vecinas */
    button.celda.ultimo { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ultimo); }
    button.celda.ultimo::after { inset: -4px; border-width: 2px; }
  }
</style>
</head>
<body>
<header>
  <div class="anillo" id="anillo">
    <div class="balota vacia" id="balota" aria-live="polite">
      <div class="letra" id="balotaLetra"></div>
      <div class="numero" id="balotaNumero"></div>
    </div>
  </div>
  <div class="info">
    <h1 class="titulo"><span id="tituloTexto">Bingo</span> <span class="corazon" aria-hidden="true">&#10084;</span></h1>
    <p class="lema" id="lema" hidden></p>
    <p class="sub">Jugadas <strong id="contador">0</strong> de 75 balotas</p>
    <p class="sub">Últimas jugadas</p>
    <div class="historial" id="historial"></div>
  </div>
  <section class="premio" id="premio" aria-labelledby="premioTitulo">
    <h2 class="premio-label" id="premioTitulo">Premio</h2>
    <div class="premio-cuerpo">
      <figure class="premio-foto" id="premioFoto" hidden>
        <img id="premioImg" alt="Imagen del premio">
        <button type="button" class="quitar" id="premioQuitar" aria-label="Quitar la imagen del premio">&times;</button>
      </figure>
      <div class="premio-texto">
        <textarea id="premioTexto" rows="2" maxlength="80" placeholder="Escribe aquí el premio" aria-labelledby="premioTitulo"></textarea>
        <label class="subir">+ Agregar imagen<input type="file" id="premioArchivo" accept="image/*" class="oculto"></label>
        <p class="aviso" id="premioAviso" role="status"></p>
      </div>
    </div>
  </section>
  <div class="acciones">
    <div class="botonera">
      <button class="accion" id="btnNuevo" type="button">Nuevo juego</button>
      <button class="accion" id="btnDeshacer" type="button" title="Borra el último número marcado (Ctrl+Z)">Borrar última</button>
      <button class="accion" id="btnLapiz" type="button" title="Cambiar título, colores y logo"><span aria-hidden="true">&#9998;</span> Personalizar</button>
    </div>
    <img class="logo" id="logo" alt="" hidden>
  </div>
</header>
<main id="tablero" aria-label="Tablero de balotas"></main>

<div class="velo" id="velo" role="dialog" aria-modal="true" aria-labelledby="veloTitulo">
  <div class="caja">
    <h2 id="veloTitulo">¿Empezar juego nuevo?</h2>
    <p>Se borrarán todos los números marcados.</p>
    <label class="check"><input type="checkbox" id="borrarPremio"> Borrar también el premio</label>
    <div class="botones">
      <button class="cancelar" id="btnCancelar" type="button">Cancelar</button>
      <button class="confirmar" id="btnConfirmar" type="button">Sí, borrar</button>
    </div>
  </div>
</div>

<dialog class="panel" id="ajustes" aria-labelledby="ajustesTitulo">
  <h2 id="ajustesTitulo">Personalizar</h2>
  <p class="nota">Los cambios se ven al instante y quedan guardados en este navegador.</p>
  <div class="campo">
    <label for="inTitulo">Título</label>
    <input type="text" id="inTitulo" maxlength="60" autocomplete="off">
  </div>
  <div class="campo">
    <label for="inLema">Lema (déjalo vacío para ocultarlo)</label>
    <input type="text" id="inLema" maxlength="80" autocomplete="off">
  </div>
  <fieldset class="campo">
    <legend>Color de la página</legend>
    <div class="muestras" id="muestras">
      <label class="otro" title="Elegir otro color">
        <input type="color" id="inColor" aria-label="Elegir otro color">
        Otro
      </label>
    </div>
  </fieldset>
  <div class="campo">
    <span class="campo-titulo"><strong>Logo</strong></span>
    <div class="logo-vista">
      <img id="logoVista" alt="Vista previa del logo">
      <span class="sin" id="logoSin" hidden>Sin logo</span>
    </div>
    <div class="fila-botones">
      <label class="chico">Subir logo<input type="file" id="logoArchivo" accept="image/*" class="oculto"></label>
      <button type="button" class="chico" id="logoQuitar">Quitar logo</button>
      <button type="button" class="chico" id="logoOriginal">Usar el original</button>
    </div>
    <p class="aviso" id="logoAviso" role="status"></p>
  </div>
  <div class="panel-pie">
    <button type="button" class="chico" id="btnRestablecer">Restablecer todo</button>
    <button type="button" class="accion listo" id="btnListo">Listo</button>
  </div>
</dialog>

<!-- Configuración inicial. Este mismo archivo sirve para cualquier bingo: cambia estos valores para
     crear una edición con otro nombre o logo. "clave" separa lo que guarda cada edición en el navegador. -->
<script id="config" type="application/json">{"clave": "bingo", "titulo": "Bingo", "lema": ""}</script>
<script>
(function () {
  var letras = ["B", "I", "N", "G", "O"];
  var CONFIG = {};
  try { CONFIG = JSON.parse(document.getElementById("config").textContent) || {}; } catch (e) {}
  var CLAVE = CONFIG.clave || "bingo";
  var CLAVE_PREMIO = CLAVE + "-premio";
  var CLAVE_AJUSTES = CLAVE + "-ajustes";
  // logo: "" = el de la configuración (si hay), "ninguno" = oculto, o una imagen subida (data URL)
  var DEF = { titulo: CONFIG.titulo || "Bingo", lema: CONFIG.lema || "", color: "", logo: "" };
  var LOGO_ORIGINAL = esImagen(CONFIG.logo) ? CONFIG.logo : "";
  var ALT_ORIGINAL = CONFIG.logoAlt || "Logo";
  var COLORES = [["Rosa (original)", "", "#d02f68"], ["Lila", "#8a4fd8"], ["Azul", "#2c6bd1"], ["Verde", "#23885a"], ["Naranja", "#e0601f"], ["Rojo", "#c9302c"]];
  var salidos = [];
  var premio = { texto: "", imagen: "" };
  var ajustes = copia(DEF);
  var quieto = window.matchMedia("(prefers-reduced-motion: reduce)");
  var oscuro = window.matchMedia("(prefers-color-scheme: dark)");
  function $(id) { return document.getElementById(id); }
  function copia(o) { return JSON.parse(JSON.stringify(o)); }

  // ---------- Guardado ----------
  function leer(clave) { try { return JSON.parse(localStorage.getItem(clave)); } catch (e) { return null; } }
  function escribir(clave, valor) { try { localStorage.setItem(clave, JSON.stringify(valor)); return true; } catch (e) { return false; } }
  function esImagen(v) { return typeof v === "string" && v.indexOf("data:image/") === 0; }
  function cadena(v, max) { return typeof v === "string" ? v.slice(0, max) : ""; }
  function guardar() { escribir(CLAVE, salidos); }
  function guardarAjustes() { return escribir(CLAVE_AJUSTES, ajustes); }

  function cargar() {
    var d = leer(CLAVE);
    if (Array.isArray(d)) salidos = d.filter(function (n) { return n >= 1 && n <= 75; });
    var p = leer(CLAVE_PREMIO) || {};
    premio = { texto: cadena(p.texto, 80), imagen: esImagen(p.imagen) ? p.imagen : "" };
    var a = leer(CLAVE_AJUSTES) || {};
    ajustes = {
      titulo: cadena(a.titulo, 60),
      lema: typeof a.lema === "string" ? a.lema.slice(0, 80) : DEF.lema,
      color: /^#[0-9a-f]{6}$/i.test(a.color) ? a.color.toLowerCase() : "",
      logo: a.logo === "ninguno" || esImagen(a.logo) ? a.logo : ""
    };
  }

  function avisar(id, mensaje) {
    var el = $(id);
    el.textContent = mensaje;
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.textContent = ""; }, 6000);
  }

  // Achica la imagen antes de guardarla para no llenar el almacenamiento del navegador
  function leerImagen(archivo, lado, listo, fallo) {
    if (!archivo) return;
    if (!/^image\//.test(archivo.type)) return fallo("Ese archivo no es una imagen.");
    var url = URL.createObjectURL(archivo);
    var img = new Image();
    img.onload = function () {
      var k = Math.min(1, lado / Math.max(img.naturalWidth || lado, img.naturalHeight || lado));
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round((img.naturalWidth || lado) * k));
      c.height = Math.max(1, Math.round((img.naturalHeight || lado) * k));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var datos = c.toDataURL("image/webp", 0.85);
      if (datos.indexOf("data:image/webp") !== 0) datos = c.toDataURL("image/png");
      listo(datos);
    };
    img.onerror = function () { URL.revokeObjectURL(url); fallo("No se pudo abrir esa imagen."); };
    img.src = url;
  }

  // Vuelve a disparar una animación CSS aunque la clase ya estuviera puesta
  function reanimar(el, clase) {
    if (!el || quieto.matches) return;
    el.classList.remove(clase);
    void el.offsetWidth;
    el.classList.add(clase);
  }

  function letraDe(n) { return letras[Math.floor((n - 1) / 15)]; }

  // ---------- Tablero ----------
  var tablero = $("tablero");
  letras.forEach(function (letra, fila) {
    var div = document.createElement("div");
    div.className = "fila";
    div.style.setProperty("--fila", fila);
    var lab = document.createElement("div");
    lab.className = "letraFila";
    lab.setAttribute("aria-hidden", "true");
    lab.textContent = letra;
    div.appendChild(lab);
    for (var i = 1; i <= 15; i++) {
      var n = fila * 15 + i;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "celda";
      b.textContent = n;
      b.id = "n" + n;
      b.setAttribute("aria-label", letra + " " + n);
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", (function (num) {
        return function () { marcar(num); };
      })(n));
      div.appendChild(b);
    }
    tablero.appendChild(div);
  });

  function pintar() {
    var ultimo = salidos.length ? salidos[salidos.length - 1] : null;
    for (var n = 1; n <= 75; n++) {
      var el = $("n" + n);
      var on = salidos.indexOf(n) !== -1;
      el.className = "celda" + (on ? (n === ultimo ? " ultimo" : " salido") : "");
      el.setAttribute("aria-pressed", on ? "true" : "false");
    }
    $("contador").textContent = salidos.length;
    $("anillo").style.setProperty("--p", salidos.length / 75);
    $("btnDeshacer").disabled = !salidos.length;
    var bal = $("balota");
    if (ultimo) {
      bal.className = "balota";
      $("balotaLetra").textContent = letraDe(ultimo);
      $("balotaNumero").textContent = ultimo;
    } else {
      bal.className = "balota vacia";
      $("balotaLetra").textContent = "Bingo";
      $("balotaNumero").textContent = "?";
    }
    var hist = $("historial");
    hist.textContent = "";
    var previos = salidos.slice(0, -1).slice(-5).reverse();
    previos.forEach(function (n) {
      var m = document.createElement("div");
      m.className = "mini";
      m.textContent = letraDe(n) + n;
      hist.appendChild(m);
    });
    if (!previos.length) {
      var s = document.createElement("span");
      s.className = "vacio";
      s.textContent = "Aquí aparecen las balotas anteriores";
      hist.appendChild(s);
    }
  }

  function marcar(n) {
    var i = salidos.indexOf(n);
    var nuevo = i === -1;
    if (nuevo) salidos.push(n);
    else salidos.splice(i, 1);
    guardar();
    pintar();
    if (nuevo) {
      reanimar($("n" + n), "pop");
      reanimar($("balota"), "entra");
      reanimar($("historial").querySelector(".mini"), "nuevo");
    }
  }

  // Borra el último número marcado (por si se marcó uno equivocado)
  function deshacer() {
    if (!salidos.length) return;
    salidos.pop();
    guardar();
    pintar();
    if (salidos.length) reanimar($("balota"), "vuelve");
  }
  $("btnDeshacer").addEventListener("click", deshacer);
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    var escribiendo = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA");
    if (!escribiendo && (e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") {
      e.preventDefault();
      deshacer();
    }
  });

  // ---------- Premio ----------
  var premioTexto = $("premioTexto");
  function pintarPremio() {
    premioTexto.value = premio.texto;
    if (premio.imagen) {
      $("premioImg").src = premio.imagen;
      $("premioFoto").hidden = false;
      $("premio").classList.add("con-foto");
    } else {
      $("premioFoto").hidden = true;
      $("premioImg").removeAttribute("src");
      $("premio").classList.remove("con-foto");
    }
  }
  premioTexto.addEventListener("input", function () {
    premio.texto = premioTexto.value.slice(0, 80);
    escribir(CLAVE_PREMIO, premio);
  });
  $("premioArchivo").addEventListener("change", function (e) {
    var archivo = e.target.files[0];
    e.target.value = "";
    leerImagen(archivo, 800, function (datos) {
      var antes = premio.imagen;
      premio.imagen = datos;
      if (!escribir(CLAVE_PREMIO, premio)) {
        premio.imagen = antes;
        return avisar("premioAviso", "La imagen es muy pesada para guardarla. Prueba con otra.");
      }
      pintarPremio();
      reanimar($("premioFoto"), "entra");
    }, function (m) { avisar("premioAviso", m); });
  });
  $("premioQuitar").addEventListener("click", function () {
    premio.imagen = "";
    escribir(CLAVE_PREMIO, premio);
    pintarPremio();
    $("premioArchivo").focus();
  });

  // ---------- Colores ----------
  var VARS = ["--fondo", "--brillo", "--panel", "--linea", "--texto", "--texto-suave", "--acento", "--salido", "--ultimo",
    "--balota-luz", "--balota", "--sobre-salido", "--sobre-ultimo", "--sobre-balota", "--sombra"];
  function rgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function hex(c) { return "#" + c.map(function (x) { return ("0" + Math.round(Math.max(0, Math.min(255, x))).toString(16)).slice(-2); }).join(""); }
  function mezclar(a, b, t) { var x = rgb(a), y = rgb(b); return hex(x.map(function (v, i) { return v + (y[i] - v) * t; })); }
  function lum(h) {
    var k = [0.2126, 0.7152, 0.0722];
    return rgb(h).reduce(function (s, v, i) { v /= 255; return s + k[i] * (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)); }, 0);
  }
  function contraste(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  // Oscurece o aclara un color hasta que se lea bien sobre el fondo
  function legible(c, fondo, minimo) {
    var meta = lum(fondo) > 0.4 ? "#000000" : "#ffffff";
    for (var i = 0; i < 14 && contraste(c, fondo) < minimo; i++) c = mezclar(c, meta, 0.12);
    return c;
  }
  function sobre(c) { return contraste("#fffafc", c) >= 3 ? "#fffafc" : "#1d1a1c"; }
  function paleta(base, noche) {
    var t = {};
    if (!noche) {
      t["--fondo"] = mezclar(base, "#ffffff", 0.94);
      t["--brillo"] = mezclar(base, "#ffffff", 0.82);
      t["--panel"] = mezclar(base, "#ffffff", 0.985);
      t["--linea"] = mezclar(base, "#ffffff", 0.72);
      t["--texto"] = legible(mezclar(base, "#1d1a1c", 0.72), t["--panel"], 7);
      t["--texto-suave"] = legible(mezclar(base, "#5a5357", 0.55), t["--fondo"], 4.5);
      t["--acento"] = legible(mezclar(base, "#000000", 0.12), t["--fondo"], 4.5);
      t["--salido"] = base;
      t["--ultimo"] = mezclar(base, "#000000", 0.3);
      t["--sombra"] = "rgba(" + rgb(t["--ultimo"]).join(", ") + ", 0.16)";
    } else {
      t["--fondo"] = mezclar(base, "#141013", 0.9);
      t["--brillo"] = mezclar(base, "#141013", 0.76);
      t["--panel"] = mezclar(base, "#1c171a", 0.85);
      t["--linea"] = mezclar(base, "#1c171a", 0.62);
      t["--texto"] = legible(mezclar(base, "#fff8fb", 0.88), t["--panel"], 7);
      t["--texto-suave"] = legible(mezclar(base, "#f3e9ee", 0.62), t["--fondo"], 4.5);
      t["--acento"] = legible(mezclar(base, "#ffffff", 0.3), t["--fondo"], 4.5);
      t["--salido"] = mezclar(base, "#000000", 0.25);
      t["--ultimo"] = mezclar(base, "#ffffff", 0.12);
      t["--sombra"] = "rgba(0, 0, 0, 0.35)";
    }
    t["--balota-luz"] = mezclar(base, "#ffffff", 0.55);
    t["--balota"] = mezclar(base, "#ffffff", 0.08);
    t["--sobre-salido"] = sobre(t["--salido"]);
    t["--sobre-ultimo"] = sobre(t["--ultimo"]);
    t["--sobre-balota"] = sobre(t["--balota"]);
    return t;
  }
  function aplicarColor() {
    var raiz = document.documentElement.style;
    if (!ajustes.color) {
      VARS.forEach(function (v) { raiz.removeProperty(v); });
    } else {
      var t = paleta(ajustes.color, oscuro.matches);
      VARS.forEach(function (v) { raiz.setProperty(v, t[v]); });
    }
    [].forEach.call(document.querySelectorAll(".muestra"), function (m) {
      m.setAttribute("aria-pressed", m.dataset.color === ajustes.color ? "true" : "false");
    });
    $("inColor").value = ajustes.color || "#d02f68";
  }
  if (oscuro.addEventListener) oscuro.addEventListener("change", aplicarColor);

  var muestras = $("muestras");
  COLORES.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "muestra";
    b.dataset.color = c[1];
    b.style.setProperty("--c", c[2] || c[1]);
    b.setAttribute("aria-label", c[0]);
    b.title = c[0];
    b.addEventListener("click", function () { ajustes.color = c[1]; guardarAjustes(); aplicarColor(); });
    muestras.insertBefore(b, muestras.lastElementChild);
  });
  $("inColor").addEventListener("input", function (e) { ajustes.color = e.target.value.toLowerCase(); guardarAjustes(); aplicarColor(); });

  // ---------- Textos y logo ----------
  function aplicarAjustes() {
    var titulo = ajustes.titulo || DEF.titulo;
    $("tituloTexto").textContent = titulo;
    document.title = titulo;
    $("lema").textContent = ajustes.lema;
    $("lema").hidden = !ajustes.lema;
    var logo = $("logo");
    var src = ajustes.logo === "ninguno" ? "" : (ajustes.logo || LOGO_ORIGINAL);
    logo.hidden = !src;
    $("logoVista").hidden = !src;
    $("logoSin").hidden = !!src;
    if (src) {
      logo.src = src;
      logo.alt = ajustes.logo ? "Logo" : ALT_ORIGINAL;
      $("logoVista").src = src;
    }
    $("logoOriginal").hidden = !LOGO_ORIGINAL;
    $("logoOriginal").disabled = !ajustes.logo;
    $("logoQuitar").disabled = !src;
    aplicarColor();
  }
  function llenarPanel() {
    $("inTitulo").value = ajustes.titulo || DEF.titulo;
    $("inLema").value = ajustes.lema;
  }
  $("inTitulo").addEventListener("input", function (e) { ajustes.titulo = e.target.value.slice(0, 60); guardarAjustes(); aplicarAjustes(); });
  $("inLema").addEventListener("input", function (e) { ajustes.lema = e.target.value.slice(0, 80); guardarAjustes(); aplicarAjustes(); });
  $("logoArchivo").addEventListener("change", function (e) {
    var archivo = e.target.files[0];
    e.target.value = "";
    leerImagen(archivo, 400, function (datos) {
      var antes = ajustes.logo;
      ajustes.logo = datos;
      if (!guardarAjustes()) {
        ajustes.logo = antes;
        return avisar("logoAviso", "Ese logo es muy pesado para guardarlo. Prueba con otro.");
      }
      aplicarAjustes();
    }, function (m) { avisar("logoAviso", m); });
  });
  $("logoQuitar").addEventListener("click", function () { ajustes.logo = "ninguno"; guardarAjustes(); aplicarAjustes(); });
  $("logoOriginal").addEventListener("click", function () { ajustes.logo = ""; guardarAjustes(); aplicarAjustes(); });
  $("btnRestablecer").addEventListener("click", function () {
    if (!window.confirm("¿Volver al título, los colores y el logo iniciales?")) return;
    ajustes = copia(DEF);
    guardarAjustes();
    aplicarAjustes();
    llenarPanel();
  });

  var panel = $("ajustes");
  $("btnLapiz").addEventListener("click", function () {
    llenarPanel();
    if (panel.showModal) panel.showModal(); else panel.setAttribute("open", "");
  });
  $("btnListo").addEventListener("click", function () { if (panel.close) panel.close(); else panel.removeAttribute("open"); });
  panel.addEventListener("click", function (e) { if (e.target === panel) panel.close(); });

  // ---------- Juego nuevo ----------
  var velo = $("velo");
  var btnNuevo = $("btnNuevo");
  function abrirVelo() { velo.classList.add("abierto"); $("btnCancelar").focus(); }
  function cerrarVelo() { velo.classList.remove("abierto"); $("borrarPremio").checked = false; btnNuevo.focus(); }
  btnNuevo.addEventListener("click", abrirVelo);
  $("btnCancelar").addEventListener("click", cerrarVelo);
  $("btnConfirmar").addEventListener("click", function () {
    salidos = [];
    guardar();
    if ($("borrarPremio").checked) {
      premio = { texto: "", imagen: "" };
      escribir(CLAVE_PREMIO, premio);
      pintarPremio();
    }
    pintar();
    cerrarVelo();
    reanimar(tablero, "de-nuevo");
  });
  velo.addEventListener("click", function (e) { if (e.target === velo) cerrarVelo(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && velo.classList.contains("abierto")) cerrarVelo();
  });

  cargar();
  aplicarAjustes();
  pintarPremio();
  pintar();
})();
</script>
</body>
</html>
