<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada | Federico Martinez</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { color-scheme: light dark; --bg: #F4F1ED; --card: #f9f8f6; --text: #2f2a24; --muted: #5e564d; --primary: #3E5A47; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1f1d; --card: #252a27; --text: #ebdcd0; --muted: #b5ac9f; --primary: #8ea395; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 440px; text-align: center; }
  .n { font-size: 4.5rem; font-weight: 800; color: var(--primary); line-height: 1; }
  h1 { font-size: 1.6rem; margin: 12px 0 10px; }
  p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
  a { display: inline-block; min-height: 44px; padding: 12px 24px; border-radius: 999px; background: var(--primary); color: #fff; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="n">404</div>
  <h1>No encontramos esta página</h1>
  <p>Puede que el enlace esté incompleto o que la página ya no exista.</p>
  <a href="/">Volver al portafolio</a>
</main>
</body>
</html>
